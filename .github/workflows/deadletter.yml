name: Dead Letter Alert

on:
  schedule:
    # 每 2 小时的第 37 分钟跑一次（monitor 在 :07，告警在 :37，错开 30 分钟避免互相抢）。
    # 同时避开 :00 和 :30 —— 这两个是 GitHub 官方点名的高峰分钟，最容易被延迟或丢弃。
    - cron: '37 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check dead letter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 阈值 12h 的依据（2026-11-03 随 monitor 降频同步调整）：
          # monitor 已从「每 2 小时」改为「每 6 小时」（4 次/天），正常间隔就是 6h，
          # 叠加 GitHub 延迟 1–2h 后，原 9h 阈值会在完全正常的情况下反复误报。
          # 12h = 两个调度周期，真停机仍能在半天内被发现。
          DEADLETTER_WINDOW_HOURS: "12"
          PYTHONUNBUFFERED: "1"
        run: python deadletter.py
