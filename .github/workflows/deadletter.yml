name: Dead Letter Alert

on:
  schedule:
    # 每 2 小时的第 37 分钟跑一次（monitor 在 :07，告警在 :37，错开 30 分钟避免互相抢）。
    # 同时避开 :00 和 :30 —— 这两个是 GitHub 官方点名的高峰分钟，最容易被延迟或丢弃。
    - cron: '37 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check dead letter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 阈值 9h 的依据：radar 被 GitHub 丢调度后，实测"正常"空窗中位数约 6h、
          # 最长约 8.94h。原值 6h 会让告警在正常节奏下就反复误报（昨天/今天各响一次）。
          # 9h = 刚好覆盖已知最长正常空窗，同时真停机仍能在 9 小时内被发现。
          DEADLETTER_WINDOW_HOURS: "9"
          PYTHONUNBUFFERED: "1"
        run: python deadletter.py
