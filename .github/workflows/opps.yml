name: Opps Scan (funding-lowzone + smallcap squeeze)

# 为什么单独一个 workflow：
#   main.py report 那条链路（monitor.yml）已经有 600s 扫描预算 + 账本写入，
#   再挂两个扫描会撞 20 分钟 timeout，把主推送拖挂。
#   这里独立跑、独立超时，失败不影响 radar 的 Telegram 日报。

on:
  schedule:
    # 每 2 小时的第 37 分钟。主 radar 是第 7 分钟，错开 30 分钟避免同时打币安接口。
    - cron: '37 */2 * * *'
    # 每天 UTC 01:07 = 北京 09:07，这一轮额外发「负费率低位」日报（0 命中也发）。
    # 第 7 分钟是为了和主 radar 的 09:07 撞车时也只差几秒，不占两个整点。
    - cron: '7 1 * * *'
  workflow_dispatch:
    inputs:
      digest:
        description: '强制发一条负费率日报（测试用）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: binance-opps
  cancel-in-progress: false

jobs:
  run-opps:
    runs-on: ubuntu-latest
    # 两个扫描串行：squeeze 预算 300s + funding 预算 420s，
    # 加上 pip install 与收尾，给 20 分钟上限。
    # （2026-11-02 实测：代理慢时 funding 单靠 150s 只跑完 12/59 个币）
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Opps Scan
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        GSHEET_CREDENTIALS: ${{ secrets.GSHEET_CREDENTIALS }}
        # 只有「每天 01:07 UTC」那一轮（或手动勾选 digest）才发负费率日报，
        # 其余 2 小时轮次只写表 —— 否则同一批币每天会刷 12 次。
        OPPS_DIGEST: ${{ (github.event.schedule == '7 1 * * *' || github.event.inputs.digest == 'true') && '1' || '0' }}
        PYTHONUNBUFFERED: "1"
      run: |
        python main.py opps
