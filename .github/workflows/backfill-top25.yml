name: Backfill OI History

on:
  workflow_dispatch:

# 最小权限：只需要读取代码
permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 手工触发的回填任务，给相对宽松的上限
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backfill
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          PYTHONUNBUFFERED: "1"
        run: python backfill_top25.py
