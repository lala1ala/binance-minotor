name: Binance Monitor Task

on:
  schedule:
    # 每 6 小时的第 7 分钟运行一次（不是整点）→ 每天 4 次，北京 08:07 / 14:07 / 20:07 / 02:07。
    # 为什么是 6 小时：原设计是 2 小时一次（12 次/天），但 GitHub 只交付约 1/3，
    # 实际落到 4 次/天、间隔 2.8–9.8h 随机。用户 2026-11-03 明确「2 小时一条太频繁，
    # 按目前节奏就好」→ 把设计值直接降到 4 次/天，密度稳定可预期，不再靠丢班产生低频。
    # 避开整点：GitHub 官方文档说明 schedule 在整点负载最高，会被延迟甚至丢弃排队任务。
    # 丢班由 Cloudflare Worker（22 */6）dispatch 兜底，不依赖本 cron 的交付率。
    - cron: '7 */6 * * *'
  workflow_dispatch: # 允许手动点击运行测试

# 最小权限：只需要读取代码
permissions:
  contents: read

concurrency:
  group: binance-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    # 硬上限。脚本内部预算是分段相加的：
    #   扫描 SCAN_BUDGET_SECONDS=600s + 补算 ENRICH_BUDGET_SECONDS=240s = 840s（14 分钟），
    #   再加账本写入、09:00 升温报告、Telegram 推送。
    # 原来设 20 分钟：扫描跑满时补算会被压到几乎没有余量，最坏情况会撞上限被 kill →
    # 报告发不出去。提到 30 分钟留出 15 分钟余量。
    # （改造前这里靠 GitHub 默认的 6 小时兜底 —— 实测中位数 266 分钟、最长 425 分钟，
    #   与下一次 2 小时调度重叠，25 次里有 5 次被 cancelled。所以不能用默认值。）
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Monitor Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        GSHEET_CREDENTIALS: ${{ secrets.GSHEET_CREDENTIALS }}
        PYTHONUNBUFFERED: "1"
      run: |
        python main.py report
