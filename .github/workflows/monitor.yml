name: Binance Monitor Task

on:
  schedule:
    # 每 2 小时的第 7 分钟运行一次（不是整点）。
    # 为什么避开整点：GitHub 官方文档明确说 schedule 事件在"每个整点"负载最高，
    # 会被延迟、负载再高时直接把排队中的任务丢掉。实测本仓库整点 cron 只交付约 1/3
    # （设计 12 次/天 → 实际 3.7 次/天，而每天 1 次的低频 cron 一天不落）。
    # 官方建议就是"把工作流安排到小时内的其他分钟"。
    - cron: '7 */2 * * *'
  workflow_dispatch: # 允许手动点击运行测试

# 最小权限：只需要读取代码
permissions:
  contents: read

concurrency:
  group: binance-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    # 硬上限：脚本内部有 10 分钟扫描预算，20 分钟足够收尾。
    # 改造前这里靠 GitHub 默认的 6 小时兜底 —— 实测中位数 266 分钟、
    # 最长 425 分钟，与下一次 2 小时调度重叠，25 次里有 5 次被 cancelled。
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Monitor Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        GSHEET_CREDENTIALS: ${{ secrets.GSHEET_CREDENTIALS }}
        PYTHONUNBUFFERED: "1"
      run: |
        python main.py report
