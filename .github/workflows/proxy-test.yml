name: Proxy Test (one-off)

on:
  workflow_dispatch: # 仅手动触发，用于诊断代理通道

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install requests
      run: pip install requests
    - name: Test in-order top-50 (radar's actual selection)
      run: |
        cat > /tmp/proxytest2.py <<'PYEOF'
        import requests, time

        FAPI = "https://fapi.binance.com/fapi/v1/time"
        txt = requests.get("https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt", timeout=15).text
        lines = [l.strip() for l in txt.splitlines() if l.strip() and ":" in l]
        print(f"列表总数: {len(lines)}")
        print(f"前3个(雷达本次运行实际会试的): {lines[:3]}")

        def test(args):
            i, px = args
            t0 = time.time()
            try:
                r = requests.get(FAPI, proxies={"http": f"http://{px}", "https": f"http://{px}"}, timeout=6)
                dt = round(time.time() - t0, 1)
                if r.status_code == 200 and "serverTime" in r.text:
                    return f"[{i:3d}] OK    {dt:>4}s  {px}"
                return f"[{i:3d}] HTTP{r.status_code} {dt:>4}s  {px}"
            except Exception as e:
                return f"[{i:3d}] FAIL  {round(time.time()-t0,1):>4}s  {px}  ({type(e).__name__})"

        # 顺序测前50个，20并发保持顺序输出
        from concurrent.futures import ThreadPoolExecutor
        with ThreadPoolExecutor(max_workers=20) as ex:
            for line in ex.map(test, list(enumerate(lines[:50]))):
                print(line)
        PYEOF
        python /tmp/proxytest2.py
